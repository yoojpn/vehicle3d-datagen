name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (datagen)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vehicle3d-datagen:latest

      - name: Build and push (serverless)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.serverless
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vehicle3d-datagen-serverless:latest
